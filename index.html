<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cheeset's web stash</title>
<meta name="description" content="Cheeset's web stash">
<meta name="theme-color" content="#0d1522">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230d1522'/%3E%3Cpath d='M20 16v10M32 24v14M44 14v12M26 36v12M40 40v10' stroke='%238fb8d8' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#e8eef6;
    --ink-soft:#9fb0c4;
    --night:#0b121e;
    --dusk:#142033;
    --pane:#1b2b42;
    --mist:#8fb8d8;
    --lilac:#a99bd0;
    --moss:#7fb5a6;
    --glass:rgba(235,244,255,.15);
    --glass-bright:rgba(242,248,255,.24);
    --glass-edge:rgba(245,250,255,.38);
    --radius:22px;
    --display:"Fraunces", Georgia, "Times New Roman", serif;
    --ui:"DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font-family:var(--ui);
    color:var(--ink);
    background:#0b121e;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .backdrop-video{position:fixed;inset:0;width:100%;height:100%;z-index:0;object-fit:contain;pointer-events:none;opacity:.82;filter:brightness(.74) saturate(.86)}
  .backdrop-shade{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(8,13,22,.2),rgba(8,13,22,.34) 70%,rgba(8,13,22,.5))}
  .fog{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(60px);opacity:.18}
  .fog i{position:absolute;border-radius:50%;display:block}
  .fog i:nth-child(1){width:55vmax;height:40vmax;left:-10%;top:5%;background:radial-gradient(closest-side,rgba(88,128,170,.55),transparent);animation:fog1 58s ease-in-out infinite alternate}
  .fog i:nth-child(2){width:50vmax;height:38vmax;right:-8%;top:30%;background:radial-gradient(closest-side,rgba(130,112,184,.4),transparent);animation:fog2 66s ease-in-out infinite alternate}
  .fog i:nth-child(3){width:60vmax;height:30vmax;left:20%;bottom:-12%;background:radial-gradient(closest-side,rgba(78,140,128,.35),transparent);animation:fog1 72s ease-in-out infinite alternate-reverse}
  @keyframes fog1{to{transform:translate3d(8vw,4vh,0) scale(1.15)}}
  @keyframes fog2{to{transform:translate3d(-9vw,-5vh,0) scale(1.1)}}

  .wrap{position:relative;z-index:1;max-width:1500px;margin:0 auto;padding:clamp(28px,6vw,72px) clamp(18px,4vw,40px) 120px}

  header{text-align:center;margin-bottom:clamp(28px,5vw,52px)}
  h1{
    font-family:var(--display);
    font-weight:300;
    font-size:clamp(2.4rem,7vw,4.6rem);
    letter-spacing:-.02em;
    line-height:1.05;
    margin:0;
    text-shadow:0 0 40px rgba(143,184,216,.35);
    animation:rise 1.4s cubic-bezier(.2,.7,.2,1) both;
  }
  .sub{
    font-family:var(--display);
    font-style:italic;
    font-weight:300;
    color:var(--ink-soft);
    font-size:clamp(1rem,2.2vw,1.25rem);
    margin:.7rem 0 0;
    animation:rise 1.4s .25s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}

  .bar{
    display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;
    margin-bottom:26px;
    animation:rise 1.4s .5s cubic-bezier(.2,.7,.2,1) both;
  }
  .tabs{display:flex;gap:6px;padding:5px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-edge);box-shadow:inset 0 1px rgba(255,255,255,.28),0 12px 36px rgba(13,25,42,.14);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3)}
  .tab{
    appearance:none;border:0;background:transparent;color:var(--ink-soft);
    font:500 .95rem var(--ui);padding:9px 20px;border-radius:999px;cursor:pointer;
    transition:background .3s,color .3s;
  }
  .tab:hover{color:var(--ink)}
  .tab[aria-selected="true"]{background:var(--glass-bright);color:#fff;box-shadow:inset 0 1px rgba(255,255,255,.4),0 2px 12px rgba(18,34,52,.16)}
  .search{
    flex:0 1 260px;min-width:160px;
    background:var(--glass);border:1px solid var(--glass-edge);color:var(--ink);
    padding:11px 18px;border-radius:999px;font:400 .95rem var(--ui);outline:none;
    box-shadow:inset 0 1px rgba(255,255,255,.28),0 12px 36px rgba(13,25,42,.14);
    backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);
    transition:background .3s,border-color .3s, box-shadow .3s;
  }
  .search::placeholder{color:rgba(239,246,255,.72)}
  .search:focus{background:rgba(245,249,255,.22);border-color:rgba(255,255,255,.58);box-shadow:0 0 0 4px rgba(220,237,255,.14),0 12px 36px rgba(13,25,42,.14)}
  .tab:focus-visible,.card:focus-visible,.media-back:focus-visible,.media-refresh:focus-visible,.player button:focus-visible,.player input:focus-visible{outline:2px solid var(--mist);outline-offset:3px}

  .grid{
    display:grid;gap:30px;
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
  @media (max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}}

  /* ---------- panels ---------- */
  .card{
    --h:210;--mx:50%;--my:50%;--rx:0deg;--ry:0deg;--d:0s;
    position:relative;display:block;aspect-ratio:16/10;
    border-radius:var(--radius);overflow:hidden;isolation:isolate;
    color:var(--ink);text-decoration:none;cursor:pointer;
    background:linear-gradient(145deg,rgba(238,247,255,.22),rgba(213,232,255,.08));
    border:1px solid rgba(245,250,255,.4);
    box-shadow:0 22px 54px -22px rgba(0,0,0,.48),inset 0 1px rgba(255,255,255,.44),inset 0 0 0 1px rgba(190,215,240,.08);
    -webkit-backdrop-filter:blur(20px) saturate(1.3);
    backdrop-filter:blur(20px) saturate(1.3);
    transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry));
    transition:transform .35s cubic-bezier(.2,.7,.2,1), box-shadow .4s;
    -webkit-tap-highlight-color:transparent;
  }
  .card.live{animation:cardIn .9s var(--stagger,0s) cubic-bezier(.2,.7,.2,1) both}
  @keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1}}
  .card:hover{box-shadow:0 26px 54px -18px rgba(0,0,0,.6),0 0 38px -8px hsl(var(--h) 60% 65% / .3),inset 0 1px rgba(255,255,255,.58)}
  .card .bg{
    position:absolute;inset:-35%;z-index:-3;
    opacity:.52;
    background:
      radial-gradient(55% 55% at 28% 30%, hsl(var(--h) 55% 46% / .9), transparent 70%),
      radial-gradient(50% 50% at 76% 72%, hsl(calc(var(--h) + 55) 50% 42% / .85), transparent 70%),
      radial-gradient(40% 40% at 70% 20%, hsl(calc(var(--h) - 40) 45% 50% / .55), transparent 70%),
      linear-gradient(135deg, hsl(var(--h) 40% 20%), hsl(calc(var(--h) + 30) 45% 12%));
    animation:drift 28s ease-in-out infinite alternate;
    animation-delay:var(--d);
  }
  @keyframes drift{
    from{transform:translate3d(-5%,-4%,0) rotate(0deg) scale(1.02)}
    to{transform:translate3d(5%,4%,0) rotate(4deg) scale(1.1)}
  }
  .card .cover{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;
    opacity:.55;filter:saturate(.85) brightness(.85);
    transition:opacity .5s, transform 1.2s;
  }
  .card::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(145deg,rgba(244,249,255,.22),rgba(220,237,255,.03) 56%,rgba(205,229,255,.12));}
  .card:hover .cover{opacity:.75;transform:scale(1.05)}
  .card .initial{
    position:absolute;right:-.06em;top:-.22em;z-index:-1;
    font:300 9.5rem/1 var(--display);color:rgba(255,255,255,.09);
    user-select:none;pointer-events:none;
  }
  .card::after{
    content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(260px circle at var(--mx) var(--my), rgba(255,255,255,.16), transparent 60%);
    opacity:0;transition:opacity .35s;
  }
  .card:hover::after{opacity:1}
  .card .label{
    position:absolute;left:0;right:0;bottom:0;z-index:2;
    padding:46px 18px 16px;
    background:linear-gradient(to top, rgba(8,14,24,.76), rgba(8,14,24,.34) 55%, transparent);
    display:flex;align-items:flex-end;justify-content:space-between;gap:10px;
  }
  .card .name{
    font:500 1.2rem/1.2 var(--display);letter-spacing:-.005em;
    text-shadow:0 2px 14px rgba(0,0,0,.56);
    overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;
  }
  .card .play{
    flex:none;width:36px;height:36px;border-radius:50%;
    display:grid;place-items:center;
    background:rgba(255,255,255,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    opacity:0;transform:translateY(6px) scale(.9);
    transition:opacity .3s, transform .3s;
  }
  .card .play svg{width:14px;height:14px;fill:#fff;margin-left:2px}
  .card:hover .play,.card:focus-visible .play{opacity:1;transform:none}
  @media (hover:none){.card .play{opacity:.85;transform:none}}

  .skeleton{
    aspect-ratio:16/10;border-radius:var(--radius);
    background:linear-gradient(110deg,rgba(27,43,66,.6) 30%,rgba(60,88,124,.35) 50%,rgba(27,43,66,.6) 70%) 0 0/250% 100%;
    animation:shimmer 2.2s linear infinite;
    border:1px solid rgba(143,184,216,.08);
  }
  @keyframes shimmer{to{background-position:-150% 0}}

  .note{
    text-align:center;color:var(--ink-soft);
    max-width:520px;margin:50px auto;padding:26px;
    line-height:1.6;font-size:1.02rem;border:1px solid var(--glass-edge);
    border-radius:var(--radius);background:var(--glass);
    box-shadow:inset 0 1px rgba(255,255,255,.3),0 18px 48px rgba(13,25,42,.16);
    backdrop-filter:blur(22px) saturate(1.25);-webkit-backdrop-filter:blur(22px) saturate(1.25);
  }
  .note h2{font:300 1.7rem var(--display);color:var(--ink);margin:0 0 .5rem}
  .note code{background:rgba(143,184,216,.12);padding:2px 7px;border-radius:6px;font-size:.9em;color:var(--ink)}
  .count{color:var(--ink-soft);font-size:.9rem;min-height:1.2em;margin:0 4px 16px}

  .media-heading{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:6px 0 20px}
  .media-title{margin:0;font:300 clamp(1.7rem,4vw,2.4rem)/1.1 var(--display)}
  .media-actions{display:flex;gap:10px}
  .media-back,.media-refresh,.player button{
    border:1px solid var(--glass-edge);color:var(--ink);background:var(--glass);
    font:500 .92rem var(--ui);padding:10px 15px;border-radius:999px;cursor:pointer;
    box-shadow:inset 0 1px rgba(255,255,255,.34),0 10px 28px rgba(13,25,42,.14);
    backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);
    transition:background .2s,border-color .2s,transform .2s;
  }
  .media-back:hover,.media-refresh:hover,.player button:hover{background:rgba(245,249,255,.24);border-color:rgba(255,255,255,.56);transform:translateY(-1px)}
  .media-card{
    appearance:none;width:100%;padding:0;text-align:left;font:inherit;
    border:1px solid rgba(255,255,255,.4);
    background:linear-gradient(145deg,rgba(245,249,255,.19),rgba(214,231,255,.065));
    box-shadow:0 20px 50px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.4);
    backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);
  }
  .media-card .cover{opacity:.94;filter:saturate(.92) brightness(1.02)}
  .media-card:hover .cover{opacity:1}
  .media-card .label{background:linear-gradient(to top,rgba(5,9,16,.79),rgba(5,9,16,.36) 60%,transparent)}
  .media-card .meta{display:block;color:rgba(232,238,246,.72);font:400 .82rem var(--ui);margin-top:5px}
  .episode-card .initial{font-size:clamp(3rem,8vw,6rem);right:12px;top:15px}
  .library-note{max-width:680px}
  .library-note code{word-break:break-word}
  .player{
    position:fixed;inset:0;z-index:10;display:grid;place-items:center;
    padding:clamp(10px,3vw,34px);background:rgba(3,6,12,.88);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  }
  .player-shell{
    position:relative;width:min(100%,1400px);aspect-ratio:16/9;max-height:calc(100dvh - 40px);
    display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:18px;
    background:#000;box-shadow:0 24px 90px rgba(0,0,0,.65);
  }
  .player-shell:fullscreen,.player-shell:-webkit-full-screen{width:100vw;height:100dvh;max-height:none;aspect-ratio:auto;border-radius:0}
  .player video{width:100%;height:100%;object-fit:contain}
  .player-top,.player-controls{
    position:absolute;left:0;right:0;z-index:1;display:flex;align-items:center;gap:12px;
    padding:18px clamp(14px,3vw,30px);transition:opacity .35s;
  }
  .player-top{top:0;justify-content:space-between;background:linear-gradient(rgba(0,0,0,.72),transparent)}
  .player-controls{bottom:0;flex-wrap:wrap;background:linear-gradient(transparent,rgba(0,0,0,.82))}
  .player-name{font:500 1rem var(--ui);text-shadow:0 1px 8px #000}
  .player button{padding:9px 13px;background:rgba(255,255,255,.14);white-space:nowrap}
  .player-play{min-width:88px}
  .player-time{font:400 .83rem var(--ui);font-variant-numeric:tabular-nums;color:#e5eaf2}
  .player-seek{flex:1 1 160px;min-width:100px;accent-color:#cfe7ff}
  .player-volume{width:clamp(70px,12vw,130px);accent-color:#cfe7ff}
  .player-shell.idle .player-top,.player-shell.idle .player-controls{opacity:0;pointer-events:none}
  .player-error{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--ink)}
  .player-error[hidden]{display:none}
  .toast{
    position:fixed;left:50%;bottom:76px;z-index:6;transform:translate(-50%,20px);
    background:rgba(231,241,255,.2);border:1px solid var(--glass-edge);
    box-shadow:inset 0 1px rgba(255,255,255,.3),0 16px 40px rgba(13,25,42,.2);
    backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
    padding:12px 20px;border-radius:14px;font-size:.92rem;max-width:90vw;text-align:center;
    opacity:0;pointer-events:none;transition:opacity .35s, transform .35s;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  [hidden]{display:none !important}

  @media (max-width:560px){
    .bar{justify-content:center}
    .search{flex:1 1 100%}
    .grid{grid-template-columns:minmax(0,1fr);gap:18px}
    .card .initial{font-size:7rem}
    .media-heading{align-items:flex-start}
    .media-actions{flex-direction:column}
    .player-shell{width:100%;aspect-ratio:auto;height:min(70vh,520px)}
    .player-controls{gap:8px;padding:12px}
    .player-volume-label{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
    .card .bg{animation:none}
  }
</style>
</head>
<body>
<video class="backdrop-video" id="backdrop" autoplay muted loop playsinline preload="metadata" aria-hidden="true"></video>
<div class="backdrop-shade" aria-hidden="true"></div>
<div class="fog" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="wrap">
  <header>
    <h1>Cheeset's web stash</h1>
    <p class="sub">please spare me github 😭</p>
  </header>

  <div class="bar">
    <div class="tabs" role="tablist" aria-label="Sections" id="tabs"></div>
    <input class="search" id="search" type="search" placeholder="Search games" aria-label="Search games" autocomplete="off">
  </div>

  <section id="view-games" role="tabpanel">
    <div class="count" id="count" aria-live="polite"></div>
    <div class="grid" id="grid"></div>
    <div class="note" id="note" hidden></div>
  </section>

  <section id="view-movies" role="tabpanel" hidden>
    <div class="media-heading">
      <h2 class="media-title" id="media-title">Shows</h2>
      <div class="media-actions">
        <button class="media-back" id="media-back" type="button" hidden>← Back</button>
        <button class="media-refresh" id="media-refresh" type="button">↻ Refresh library</button>
      </div>
    </div>
    <div class="count" id="media-count" aria-live="polite"></div>
    <div class="grid" id="media-grid"></div>
    <div class="note library-note" id="media-note" hidden></div>
  </section>
</div>

<div class="toast" id="toast" role="status"></div>
<div class="player" id="player" role="dialog" aria-modal="true" aria-label="Video player" hidden>
  <div class="player-shell" id="player-shell">
    <video id="episode-video" playsinline preload="metadata"></video>
    <div class="player-error" id="player-error" role="status" hidden></div>
    <div class="player-top">
      <span class="player-name" id="player-name"></span>
      <button id="player-leave" type="button" aria-label="Close player">✕ Leave</button>
    </div>
    <div class="player-controls">
      <button class="player-play" id="player-play" type="button" aria-label="Play">▶ Play</button>
      <span class="player-time" id="player-current">0:00</span>
      <input class="player-seek" id="player-seek" type="range" min="0" max="1000" value="0" aria-label="Seek video">
      <span class="player-time" id="player-duration">0:00</span>
      <label class="player-volume-label" for="player-volume">Volume</label>
      <input class="player-volume" id="player-volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume">
      <button id="player-fullscreen" type="button">⛶ Fullscreen</button>
    </div>
  </div>
</div>

<script>
/* ================================================================
   SETTINGS
   ================================================================ */
// Used only when the site is NOT running on <owner>.github.io/<repo>
// (for example a custom domain). On GitHub Pages these are detected from the URL.
const CONFIG = { owner: 'Cheesetidk', repo: 'Carri' };

// Folder names that count as the game library (any capitalisation, with or without the s).
const GAMES_FOLDER = /^assets?$/i;

// Sections shown as tabs. Media is discovered from the repository tree like games.
const SECTIONS = [
  { id: 'games',  label: 'Games',          folder: GAMES_FOLDER,           enabled: true  },
  { id: 'movies', label: 'Movies & Shows', folder: /^media$/i,              enabled: true  },
];

const CACHE_KEY = 'cws-tree-v2';
const CACHE_MS  = 5 * 60 * 1000;

/* ================================================================
   HELPERS
   ================================================================ */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = (p) => p.split('/').map(encodeURIComponent).join('/');
const BASE = new URL('./', location.href).href;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

function repoInfo() {
  const h = location.hostname;
  if (h.endsWith('.github.io')) {
    const owner = h.split('.')[0];
    const seg = location.pathname.split('/').filter(Boolean)[0];
    const repo = (seg && !/\.[a-z0-9]+$/i.test(seg)) ? seg : `${owner}.github.io`;
    return { owner, repo };
  }
  return CONFIG;
}

function pretty(s) {
  s = s.replace(/\.html?$/i, '').replace(/[_\-.]+/g, ' ').replace(/([a-z])([A-Z])/g, '$1 $2').replace(/\s+/g, ' ').trim();
  return s.split(' ').map(w => w ? w[0].toUpperCase() + w.slice(1) : w).join(' ') || 'Untitled';
}
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 4200);
}

/* ================================================================
   FINDING THE GAMES (reads the repo's file list, so new games appear on their own)
   ================================================================ */
async function fetchRepoPaths() {
  const { owner, repo } = repoInfo();
  let lastErr;
  for (const ref of ['HEAD', 'main', 'master']) {
    try {
      const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/${ref}?recursive=1`, { headers: { Accept: 'application/vnd.github+json' }, cache: 'no-store' });
      if (!r.ok) { lastErr = new Error('GitHub answered ' + r.status); if (r.status === 403 || r.status === 429) break; continue; }
      const j = await r.json();
      return j.tree.filter(t => t.type === 'blob').map(t => t.path);
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('Could not reach GitHub');
}

async function getPaths(forceRefresh = false) {
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch {}
  if (!forceRefresh && cached && Date.now() - cached.t < CACHE_MS) return cached.paths;
  try {
    const all = await fetchRepoPaths();
    // keep only what we need so the cache stays small
    const keep = all.filter(p => p.includes('/') && SECTIONS.some(s => s.folder.test(p.split('/')[0])));
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), paths: keep })); } catch {}
    return keep;
  } catch (e) {
    if (cached) return cached.paths;          // fall back to the last good copy
    // optional manual fallback: a games.json file next to index.html
    try {
      const r = await fetch('games.json', { cache: 'no-store' });
      if (r.ok) { const list = await r.json(); return list.map(p => p.replace(/^\/+/, '')); }
    } catch {}
    throw e;
  }
}

const HTML_RX  = /\.html?$/i;
const IMG_RX   = /\.(png|jpe?g|webp|gif|avif)$/i;
const COVER_RX = /(^|\/)(cover|thumb|thumbnail|icon|logo|poster|preview|banner)[^/]*\.(png|jpe?g|webp|gif|avif)$/i;
const VIDEO_RX = /\.(webm|mp4|m4v|mov|ogv)$/i;

function buildGames(paths, folderRx) {
  const files = new Set(paths);
  const groups = new Map();
  const games = [];

  for (const p of paths) {
    const parts = p.split('/');
    if (parts.length < 2 || !folderRx.test(parts[0])) continue;
    if (parts.some(x => x.startsWith('.'))) continue;
    const root = parts[0];
    const rest = parts.slice(1);

    if (rest.length === 1) {                       // asset/Game.html
      if (!HTML_RX.test(rest[0])) continue;
      const base = rest[0].replace(HTML_RX, '');
      const sibling = paths.find(q => { const qq = q.split('/'); return qq.length === 2 && qq[0] === root && IMG_RX.test(qq[1]) && qq[1].replace(IMG_RX, '').toLowerCase() === base.toLowerCase(); });
      games.push({ name: pretty(rest[0]), entry: p, cover: sibling || null });
    } else {                                       // asset/Game/...
      const key = root + '/' + rest[0];
      if (!groups.has(key)) groups.set(key, { dir: rest[0], root, list: [] });
      groups.get(key).list.push(rest.slice(1).join('/'));
    }
  }

  for (const [key, g] of groups) {
    const htmls = g.list.filter(f => HTML_RX.test(f));
    if (!htmls.length) continue;
    const byDepth = (a, b) => a.split('/').length - b.split('/').length || a.localeCompare(b);
    const entryRel =
      htmls.find(f => f.toLowerCase() === 'index.html') ||
      htmls.filter(f => !f.includes('/')).sort()[0] ||
      htmls.filter(f => /(^|\/)index\.html?$/i.test(f)).sort(byDepth)[0] ||
      htmls.sort(byDepth)[0];
    const coverRel = g.list.filter(f => COVER_RX.test(f)).sort(byDepth)[0];
    games.push({ name: pretty(g.dir), entry: key + '/' + entryRel, cover: coverRel ? key + '/' + coverRel : null });
  }

  const seen = new Set();
  return games
    .filter(g => !seen.has(g.entry) && seen.add(g.entry))
    .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));
}

function buildShows(paths) {
  const shows = new Map();
  for (const path of paths) {
    const parts = path.split('/');
    if (parts.length < 4 || !/^media$/i.test(parts[0]) || parts.some(part => part.startsWith('.'))) continue;
    const showPath = parts.slice(0, 2).join('/');
    if (!shows.has(showPath)) shows.set(showPath, { path: showPath, name: pretty(parts[1]), seasons: new Map() });
    const show = shows.get(showPath);
    const seasonName = parts[2];
    if (!/^(?:s\d+|season[\s._-]*\d+)$/i.test(seasonName)) continue;
    if (!show.seasons.has(seasonName)) show.seasons.set(seasonName, { name: pretty(seasonName), episodes: new Map() });
    const season = show.seasons.get(seasonName);
    let episodeName, videoPath;
    if (parts.length === 4 && VIDEO_RX.test(parts[3])) {
      episodeName = pretty(parts[3].replace(VIDEO_RX, ''));
      videoPath = path;
    } else if (parts.length >= 5 && VIDEO_RX.test(parts[parts.length - 1])) {
      episodeName = pretty(parts[3]);
      videoPath = path;
    }
    if (videoPath && !season.episodes.has(episodeName)) season.episodes.set(episodeName, { name: episodeName, path: videoPath });
  }

  const sortNames = (a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
  return [...shows.values()].map(show => {
    const basename = show.path.split('/').pop();
    const root = show.path.split('/')[0];
    const showImages = paths.filter(path => {
      const parts = path.split('/');
      return parts.length === 3 && path.startsWith(show.path + '/') && IMG_RX.test(parts[2]);
    }).sort(sortNames);
    const cover = showImages.find(path => {
      const filename = path.split('/').pop();
      return filename.replace(IMG_RX, '').toLowerCase() === basename.toLowerCase();
    }) || showImages.find(path => COVER_RX.test(path)) || showImages[0] || paths.find(path => {
      const parts = path.split('/');
      return parts.length === 2 && parts[0] === root && IMG_RX.test(parts[1]) &&
        parts[1].replace(IMG_RX, '').toLowerCase() === basename.toLowerCase();
    }) || paths.find(path => path.startsWith(show.path + '/') && COVER_RX.test(path)) || null;
    show.cover = cover;
    show.seasons = [...show.seasons.entries()]
      .map(([key, season]) => ({ ...season, key, episodes: [...season.episodes.values()].sort((a, b) => sortNames(a.name, b.name)) }))
      .filter(season => season.episodes.length)
      .sort((a, b) => sortNames(a.name, b.name));
    return show;
  }).filter(show => show.seasons.length)
    .sort((a, b) => sortNames(a.name, b.name));
}

/* ================================================================
   LAUNCHING (opens an about:blank tab and loads the game inside it)
   ================================================================ */
function launch(game) {
  const url = BASE + enc(game.entry);
  const w = window.open('about:blank', '_blank');
  if (!w) { toast('Your browser blocked the pop-up. Allow pop-ups for this site and try again.'); return; }
  const d = w.document;
  d.open();
  d.write(
    '<!doctype html><html><head><meta charset="utf-8">' +
    '<meta name="viewport" content="width=device-width, initial-scale=1">' +
    '<title>' + esc(game.name) + '</title>' +
    '<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style>' +
    '</head><body><iframe src="' + esc(url) + '" allow="fullscreen; autoplay; gamepad; clipboard-write; microphone; camera" allowfullscreen></iframe></body></html>'
  );
  d.close();
}

const grid = $('#grid');
let allCards = [];

function makeCard(game, i) {
  const h = hash(game.name) % 360;
  const a = document.createElement('a');
  a.className = 'card live';
  a.href = BASE + enc(game.entry);
  a.dataset.name = game.name.toLowerCase();
  a.style.setProperty('--h', h);
  a.style.setProperty('--d', (-(hash(game.name + 'd') % 14)) + 's');
  a.style.setProperty('--stagger', Math.min(i, 14) * 0.05 + 's');
  a.setAttribute('aria-label', 'Open ' + game.name);
  a.innerHTML =
    '<div class="bg"></div>' +
    (game.cover ? '<img class="cover" alt="" loading="lazy" src="' + esc(BASE + enc(game.cover)) + '">' : '') +
    '<div class="initial">' + esc(game.name.trim()[0] || '?') + '</div>' +
    '<div class="label"><span class="name">' + esc(game.name) + '</span>' +
    '<span class="play"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></span></div>';

  const img = a.querySelector('.cover');
  if (img) img.addEventListener('error', () => img.remove());

  a.addEventListener('click', (e) => {
    if (e.ctrlKey || e.metaKey || e.shiftKey || e.button === 1) return;
    e.preventDefault(); launch(game);
  });

  a.addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'mouse' || reduced) return;
    const r = a.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    a.style.setProperty('--mx', (x * 100) + '%');
    a.style.setProperty('--my', (y * 100) + '%');
    a.style.setProperty('--ry', ((x - .5) * 9) + 'deg');
    a.style.setProperty('--rx', ((.5 - y) * 9) + 'deg');
  });
  a.addEventListener('pointerleave', () => { a.style.setProperty('--rx', '0deg'); a.style.setProperty('--ry', '0deg'); });
  a.addEventListener('animationend', (e) => { if (e.animationName === 'cardIn') a.classList.remove('live'); });
  return a;
}

function showSkeletons() {
  grid.innerHTML = '';
  for (let i = 0; i < 8; i++) { const s = document.createElement('div'); s.className = 'skeleton'; s.style.animationDelay = (i * .12) + 's'; grid.appendChild(s); }
}

function showNote(html) { const n = $('#note'); n.innerHTML = html; n.hidden = false; }
function hideNote() { $('#note').hidden = true; }

function applyFilter() {
  const q = $('#search').value.trim().toLowerCase();
  let shown = 0;
  for (const c of allCards) { const ok = !q || c.dataset.name.includes(q); c.hidden = !ok; if (ok) shown++; }
  const total = allCards.length;
  $('#count').textContent = total ? (q ? `${shown} of ${total} games` : `${total} ${total === 1 ? 'game' : 'games'}`) : '';
  if (total && !shown) showNote('<h2>No match</h2><p>Nothing in the stash matches that search.</p>'); else if (total) hideNote();
}

async function loadGames() {
  showSkeletons(); hideNote();
  try {
    const paths = await getPaths();
    const games = buildGames(paths, GAMES_FOLDER);
    grid.innerHTML = '';
    allCards = games.map(makeCard);
    allCards.forEach(c => grid.appendChild(c));
    if (!games.length) {
      $('#count').textContent = '';
      showNote('<h2>The stash is empty</h2><p>Add a game to the <code>asset</code> folder in the repo. It can be a single <code>.html</code> file or a folder with an <code>index.html</code> inside. Refresh after a minute or two and it will show up here.</p>');
    } else applyFilter();
  } catch (e) {
    grid.innerHTML = ''; $('#count').textContent = '';
    showNote('<h2>Couldn\'t load the stash</h2><p>GitHub didn\'t return the file list (' + esc(e.message || 'network error') + '). This usually clears up within a few minutes. Check that the repo is public, then refresh.</p>');
  }
}

SECTIONS.forEach((s, i) => {

  b.setAttribute('aria-selected', i === 0 ? 'true' : 'false');

  b.addEventListener('click', () => selectTab(s.id));

});
function selectTab(id) {
  tabsEl.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.id === id)));
  $('#view-games').hidden = id !== 'games';
  $('#view-movies').hidden = id !== 'movies';
  $('#search').hidden = false;
  $('#search').placeholder = id === 'games' ? 'Search games' : mediaLevel === 'shows' ? 'Search shows' : mediaLevel === 'seasons' ? 'Search seasons' : 'Search episodes';
  $('#search').setAttribute('aria-label', $('#search').placeholder);
  if (id === 'games') applyFilter();
  if (id === 'movies' && !mediaReady) loadMedia();
}

   SHOW LIBRARY
   ================================================================ */
const mediaGrid = $('#media-grid');
let mediaShows = [];
let mediaLevel = 'shows';
let currentShow = null;
let currentSeason = null;
let mediaReady = false;
let mediaCards = [];
let playerOpener = null;
let controlsTimer;

function showMediaNote(html) {
  const note = $('#media-note');
  note.innerHTML = html;
  note.hidden = false;
}

function makeMediaCard(title, detail, cover, action, index, episode = false) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'card media-card live' + (episode ? ' episode-card' : '');
  button.dataset.name = (title + ' ' + detail).toLowerCase();
  button.style.setProperty('--h', hash(title) % 360);
  button.style.setProperty('--stagger', Math.min(index, 14) * .05 + 's');
  button.setAttribute('aria-label', `${title}${detail ? ', ' + detail : ''}`);
  button.innerHTML =
    '<div class="bg"></div>' +
    (cover ? '<img class="cover" alt="" loading="lazy" src="' + esc(BASE + enc(cover)) + '">' : '') +
    '<div class="initial">' + esc(title.trim()[0] || '?') + '</div>' +
    '<div class="label"><span><span class="name">' + esc(title) + '</span>' +
    (detail ? '<span class="meta">' + esc(detail) + '</span>' : '') +
    '</span><span class="play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></span></div>';
  const image = button.querySelector('.cover');
  if (image) image.addEventListener('error', () => image.remove());
  button.addEventListener('click', action);
  button.addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse' || reduced) return;
    const rect = button.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width, y = (e.clientY - rect.top) / rect.height;
    button.style.setProperty('--mx', (x * 100) + '%');
    button.style.setProperty('--my', (y * 100) + '%');
    button.style.setProperty('--ry', ((x - .5) * 7) + 'deg');
    button.style.setProperty('--rx', ((.5 - y) * 7) + 'deg');
  });
  button.addEventListener('pointerleave', () => {
    button.style.setProperty('--rx', '0deg');
    button.style.setProperty('--ry', '0deg');
  });
  button.addEventListener('animationend', e => { if (e.animationName === 'cardIn') button.classList.remove('live'); });
  return button;
}

function renderMedia() {
  const title = $('#media-title');
  const back = $('#media-back');
  mediaGrid.innerHTML = '';
  $('#media-note').hidden = true;
  mediaCards = [];
  let items = [];
  if (mediaLevel === 'shows') {
    title.textContent = 'Shows';
    back.hidden = true;
    items = mediaShows.map((show, index) => makeMediaCard(show.name, `${show.seasons.length} ${show.seasons.length === 1 ? 'season' : 'seasons'}`, show.cover, () => {
      $('#search').value = '';
      currentShow = show;
      mediaLevel = 'seasons';
      renderMedia();
    }, index));
    if (!items.length) {
      showMediaNote('<h2>No shows found yet</h2><p class="library-note">Add a show folder under <code>Media/Show Name/</code>, with a sibling poster such as <code>Media/Show Name.jpg</code>. Add episodes under <code>Media/Show Name/S1/Episode 1/video.webm</code>. Use the refresh button after adding files.</p>');
    }
  } else if (mediaLevel === 'seasons' && currentShow) {
    title.textContent = currentShow.name;
    back.hidden = false;
    back.textContent = '← Shows';
    items = currentShow.seasons.map((season, index) => makeMediaCard(season.name, `${season.episodes.length} ${season.episodes.length === 1 ? 'episode' : 'episodes'}`, null, () => {
      $('#search').value = '';
      currentSeason = season;
      mediaLevel = 'episodes';
      renderMedia();
    }, index));
  } else if (mediaLevel === 'episodes' && currentShow && currentSeason) {
    title.textContent = `${currentShow.name} · ${currentSeason.name}`;
    back.hidden = false;
    back.textContent = `← ${currentShow.name}`;
    items = currentSeason.episodes.map((episode, index) => makeMediaCard(episode.name, 'Play episode', currentShow.cover, () => openPlayer(episode, currentShow, currentSeason), index, true));
  }
  mediaCards = items;
  mediaCards.forEach(card => mediaGrid.appendChild(card));
  $('#search').placeholder = mediaLevel === 'shows' ? 'Search shows' : mediaLevel === 'seasons' ? 'Search seasons' : 'Search episodes';
  $('#search').setAttribute('aria-label', $('#search').placeholder);
  filterMedia();
}

function filterMedia() {
  const query = $('#search').value.trim().toLowerCase();
  let shown = 0;
  for (const card of mediaCards) {
    const visible = !query || card.dataset.name.includes(query);
    card.hidden = !visible;
    if (visible) shown++;
  }
  const total = mediaCards.length;
  $('#media-count').textContent = total ? (query ? `${shown} of ${total} ${mediaLevel}` : `${total} ${total === 1 ? mediaLevel.slice(0, -1) : mediaLevel}`) : '';
  if (total && !shown) showMediaNote('<h2>No match</h2><p>Nothing at this level matches that search.</p>');
  else if (mediaLevel !== 'shows' || total) $('#media-note').hidden = true;
}

async function loadMedia(forceRefresh = false) {
  const refresh = $('#media-refresh');
  refresh.disabled = true;
  refresh.textContent = '↻ Loading…';
  try {
    const paths = await getPaths(forceRefresh);
    mediaShows = buildShows(paths);
    mediaReady = true;
    if (currentShow) currentShow = mediaShows.find(show => show.path === currentShow.path) || null;
    if (!currentShow) { mediaLevel = 'shows'; currentSeason = null; }
    else if (currentSeason) currentSeason = currentShow.seasons.find(season => season.key === currentSeason.key) || null;
    if (!currentSeason && mediaLevel === 'episodes') mediaLevel = 'seasons';
    renderMedia();
  } catch (error) {
    mediaGrid.innerHTML = '';
    $('#media-count').textContent = '';
    showMediaNote('<h2>Couldn’t load the media library</h2><p>GitHub didn’t return the file list (' + esc(error.message || 'network error') + '). Check that the repository is public, then refresh.</p>');
  } finally {
    refresh.disabled = false;
    refresh.textContent = '↻ Refresh library';
  }
}

$('#media-back').addEventListener('click', () => {
  if (mediaLevel === 'episodes') {
    mediaLevel = 'seasons';
    currentSeason = null;
  } else {
    mediaLevel = 'shows';
    currentShow = null;
  }
  $('#search').value = '';
  renderMedia();
});
$('#media-refresh').addEventListener('click', () => loadMedia(true));

/* ================================================================
   VIDEO PLAYER
   ================================================================ */
const player = $('#player');
const playerShell = $('#player-shell');
const playerVideo = $('#episode-video');
const playerPlay = $('#player-play');
const playerError = $('#player-error');

function formatTime(seconds) {
  if (!Number.isFinite(seconds)) return '0:00';
  const value = Math.max(0, Math.floor(seconds));
  const hours = Math.floor(value / 3600);
  const minutes = Math.floor((value % 3600) / 60);
  const remainder = String(value % 60).padStart(2, '0');
  return hours ? `${hours}:${String(minutes).padStart(2, '0')}:${remainder}` : `${minutes}:${remainder}`;
}

function updatePlayButton() {
  const playing = !playerVideo.paused && !playerVideo.ended;
  playerPlay.textContent = playing ? 'Ⅱ Pause' : '▶ Play';
  playerPlay.setAttribute('aria-label', playing ? 'Pause' : 'Play');
}

function showPlayerControls() {
  playerShell.classList.remove('idle');
  clearTimeout(controlsTimer);
  if (playerVideo.paused || !playerError.hidden) return;
  controlsTimer = setTimeout(() => playerShell.classList.add('idle'), 2600);
}

function openPlayer(episode, show, season) {
  playerOpener = document.activeElement;
  $('#player-name').textContent = `${show.name} · ${season.name} · ${episode.name}`;
  playerError.hidden = true;
  playerShell.classList.remove('idle');
  $('#player-current').textContent = '0:00';
  $('#player-duration').textContent = '0:00';
  $('#player-seek').value = '0';
  playerVideo.src = BASE + enc(episode.path);
  playerVideo.volume = Number($('#player-volume').value);
  player.hidden = false;
  document.body.style.overflow = 'hidden';
  backdrop.pause();
  $('#player-leave').focus();
  playerVideo.load();
  playerVideo.play().catch(() => showPlayerControls());
}

function closePlayer() {
  clearTimeout(controlsTimer);
  player.hidden = true;
  playerShell.classList.remove('idle');
  playerVideo.pause();
  playerVideo.removeAttribute('src');
  playerVideo.load();
  playerError.hidden = true;
  document.body.style.overflow = '';
  if (!document.hidden) backdrop.play().catch(() => {});
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  if (playerOpener && playerOpener.isConnected) playerOpener.focus();
}

playerPlay.addEventListener('click', () => {
  if (playerVideo.paused) playerVideo.play().catch(() => showPlayerControls());
  else playerVideo.pause();
});
playerVideo.addEventListener('play', () => { updatePlayButton(); showPlayerControls(); });
playerVideo.addEventListener('pause', () => { updatePlayButton(); showPlayerControls(); });
playerVideo.addEventListener('ended', () => { updatePlayButton(); showPlayerControls(); });
playerVideo.addEventListener('loadedmetadata', () => { $('#player-duration').textContent = formatTime(playerVideo.duration); });
playerVideo.addEventListener('timeupdate', () => {
  $('#player-current').textContent = formatTime(playerVideo.currentTime);
  if (Number.isFinite(playerVideo.duration) && playerVideo.duration > 0) {
    $('#player-seek').value = String(Math.round(playerVideo.currentTime / playerVideo.duration * 1000));
  }
});
playerVideo.addEventListener('error', () => {
  playerError.textContent = 'This video could not be played. Check that the video file is committed and uses a browser-supported codec.';
  playerError.hidden = false;
  showPlayerControls();
});
$('#player-seek').addEventListener('input', event => {
  if (Number.isFinite(playerVideo.duration)) playerVideo.currentTime = Number(event.target.value) / 1000 * playerVideo.duration;
  showPlayerControls();
});
$('#player-volume').addEventListener('input', event => {
  playerVideo.volume = Number(event.target.value);
  try { localStorage.setItem('cws-player-volume', event.target.value); } catch {}
  showPlayerControls();
});
$('#player-fullscreen').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => toast('Could not leave fullscreen mode.'));
  else if (playerShell.requestFullscreen) playerShell.requestFullscreen().catch(() => toast('Fullscreen is not available in this browser.'));
  else toast('Fullscreen is not available in this browser.');
});
$('#player-leave').addEventListener('click', closePlayer);
player.addEventListener('click', event => { if (event.target === player) closePlayer(); });
playerShell.addEventListener('pointermove', showPlayerControls);
playerShell.addEventListener('touchstart', showPlayerControls, { passive: true });
playerVideo.addEventListener('click', () => {
  if (playerVideo.paused) playerVideo.play().catch(() => showPlayerControls());
  else playerVideo.pause();
});
playerShell.addEventListener('keydown', event => {
  if (event.target instanceof HTMLInputElement || event.target instanceof HTMLButtonElement) return;
  if (event.key === ' ' || event.key.toLowerCase() === 'k') {
    event.preventDefault();
    playerVideo.paused ? playerVideo.play().catch(() => showPlayerControls()) : playerVideo.pause();
  } else if (event.key.toLowerCase() === 'f') {
    $('#player-fullscreen').click();
  } else if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    playerVideo.currentTime = Math.max(0, playerVideo.currentTime + (event.key === 'ArrowLeft' ? -10 : 10));
    showPlayerControls();
  }
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && !player.hidden) closePlayer();
});
document.addEventListener('fullscreenchange', () => {
  $('#player-fullscreen').textContent = document.fullscreenElement ? '⛶ Exit fullscreen' : '⛶ Fullscreen';
});

let savedVolume;
try { savedVolume = localStorage.getItem('cws-player-volume'); } catch {}
if (savedVolume !== null && Number.isFinite(Number(savedVolume))) {
  const volume = Math.min(1, Math.max(0, Number(savedVolume)));
  $('#player-volume').value = String(volume);
  playerVideo.volume = volume;
}

   VIDEO BACKGROUND
   ================================================================ */
const backdrop = $('#backdrop');
backdrop.src = BASE + enc('Untitled design.mp4');
backdrop.addEventListener('error', () => toast('The background video could not be loaded.'));
document.addEventListener('visibilitychange', () => {
  if (document.hidden) backdrop.pause();
  else backdrop.play().catch(() => {});
});

selectTab('games');
loadGames();
